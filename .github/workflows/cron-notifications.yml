name: Scheduled notifications

# Replaces Vercel Cron (hourly is Pro-only / billed there). Hits the same
# authenticated endpoint. GitHub Actions scheduled runs are free.
#
# Required repo config (Settings → Secrets and variables → Actions → Secrets):
#   - Secret  CRON_SECRET  — must match the deployment's CRON_SECRET env var
#   - Secret  APP_URL      — deployment origin, e.g. https://grindkit.vercel.app
#
# Note: scheduled runs may be delayed a few minutes under GitHub load. The
# endpoint dedupes within a 3-hour window, so re-runs/manual runs are safe.

on:
  schedule:
    - cron: "0 * * * *" # top of every hour (UTC)
  workflow_dispatch: {} # manual "Run workflow" button for testing

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notification dispatch
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing APP_URL variable or CRON_SECRET secret"
            exit 1
          fi
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/notifications"
